<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yumimil apps</title>
<style>
:root{--bg:#FDFAF8;--card:#fff;--text:#4A4650;--sub:#8C8792;--accent:#F08AA6;--line:#F0E9ED}
@media (prefers-color-scheme:dark){:root{--bg:#1C1A20;--card:#2A2630;--text:#F3EEF2;--sub:#B9B2C0;--line:#3A3542}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:40px 16px 64px}
header{text-align:center;margin-bottom:28px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:300;font-size:36px;letter-spacing:.02em;margin:0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 6px 18px rgba(217,167,184,.16);color:inherit;text-decoration:none}
.card h2{font-size:18px;margin:0}
.card p{font-size:14px;color:var(--sub);margin:4px 0 0}
a{color:var(--accent)}
footer{text-align:center;color:var(--sub);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<header>
<p class="logo">yumimil apps</p>
</header>
<main>
<a class="card" href="glowy/">
<h2>Glowy</h2>
<p>毎日の開運アプリ｜小さな行動で、運をひらく。</p>
</a>
<a class="card" href="tapstamp/">
<h2>TapStamp</h2>
<p>タップするだけで、今の日時を記録。</p>
</a>
</main>
<footer>
<p>お問い合わせ：<a href="mailto:support@yumimil.com">support@yumimil.com</a></p>
</footer>
</div>
</body>
</html>
